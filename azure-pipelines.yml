# trigger azure devops pipeline on commit on master
trigger:
- master


# vm: ubuntu latest
pool:
  vmImage: 'ubuntu-latest'


# install dotnet sdk 10.x
steps:
- task: UseDotNet@2
  displayName: '//=> dotnet install sdk 10.x'
  inputs:
    packageType: sdk
    version: 10.x
    includePreviewVersions: false
    installationPath: $(Agent.ToolsDirectory)/dotnet


# dotenet build all projects as Release
- task: DotNetCoreCLI@2
  displayName: '//=> dotnet build'
  inputs:
    command: build
    projects: '**/*.csproj'
    arguments: '--configuration Release'


# dotenet test all tests and collect code coverage
- task: DotNetCoreCLI@2
  displayName: '//=> dotnet test'
  inputs:
    command: test
    projects: '**/*Tests/*.csproj'
    arguments: '--configuration $(BuildConfiguration) --collect:"XPlat Code Coverage"'


# pack only the intended NuGet projects
- task: DotNetCoreCLI@2
  displayName: '//=> dotnet pack'
  inputs:
    command: pack
    packagesToPack: >-
      src/AntonYoung.Validators.Abstractions/AntonYoung.Validators.Abstractions.csproj;
      src/AntonYoung.Validators.Postalcode/AntonYoung.Validators.Postalcode.csproj;
      src/AntonYoung.Validators.Iban/AntonYoung.Validators.Iban.csproj
    configuration: '$(buildConfiguration)'
    packDirectory: '$(Build.ArtifactStagingDirectory)/nuget'
    versioningScheme: 'off'

# authenticate with Azure Artifacts
- task: NuGetAuthenticate@1
  displayName: '//=> nuget authenticate'

# push only packages from the dedicated NuGet output directory
- bash: |
    dotnet nuget push "$(Build.ArtifactStagingDirectory)/nuget/*.nupkg" \
      --source "https://pkgs.dev.azure.com/antonyoung/Validator/_packaging/antonyoung-nuget-packages/nuget/v3/index.json" \
      --api-key AzureArtifacts \
  displayName: '//=> dotnet nuget push'